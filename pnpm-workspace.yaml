  drizzle-orm: 0.45.2
  drizzle-zod: 0.8.3
  i18next: 26.4.0
  ioredis: 6.0.0
  nodemailer: 9.0.5
  pg: 8.23.0
  pino: 10.3.1
  react-i18next: 17.0.12
  superjson: 2.2.6
  trpc-to-openapi: 3.3.0
