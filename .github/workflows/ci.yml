name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  verify:
    name: Lint, Typecheck, Test, Build, Package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Restore Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify dependency version alignment (catalog policy)
        run: pnpm syncpack:lint

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck (TypeScript 7)
        run: pnpm turbo run check-types

      - name: Build packages (includes publint + attw gates)
        run: pnpm turbo run build

      - name: Assert build did not rewrite any package.json
        run: git diff --exit-code -- 'packages/*/package.json'

      - name: Unit tests with 100% coverage gate
        run: pnpm test

      - name: Prove the coverage gate can fail
        run: pnpm coverage:canary

      - name: Bundle-size and tree-shaking budgets
        run: pnpm size

      - name: Detect unused files, deps and exports
        run: pnpm knip

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Restore Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-e2e-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-e2e-${{ runner.os }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium webkit

      - name: Start the Docker stack (postgres + redis + mailpit)
        run: |
          cp .env.example .env
          docker compose -f docker/compose.yaml --env-file .env up -d --wait

      - name: Apply migrations and seed
        run: pnpm db:migrate && pnpm db:seed

      - name: Build workspace
        run: pnpm turbo run build

      - name: Run integration suite (live RLS/Redis contracts)
        run: pnpm test:integration

      - name: Run E2E tests (full API flow + i18n against the stack)
        run: pnpm e2e
        env:
          E2E_STACK: "1"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
