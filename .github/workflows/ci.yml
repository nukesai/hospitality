name: CI

# `push:` triggers are deliberately absent. Every merge target is PR-gated, and
# each release workflow calls this same suite as a reusable workflow before it
# publishes — so a commit that reaches development/staging/main has already run
# these gates twice, not three times. That is what keeps the Docker/Playwright
# e2e job at 3 runs per feature instead of 6.
on:
  pull_request:
    branches: [main, staging, development]
  workflow_call: # the release workflows call this as their pre-publish gate
  workflow_dispatch: # the back-merge dispatches this on development

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  verify:
    name: Lint, Typecheck, Test, Build, Package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Restore Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Scoped to feature PRs into `development` ONLY. On any other base this
      # gate is not merely useless but actively wrong: on the back-merge
      # recovery PR (head = main after a release, base = a lagging staging) it
      # exits 1 forever, because status.mjs:20 passes `since` to readChangesets
      # so the consumed changesets vanish while `package.json` still counts as a
      # changed package. Reproduced: "Some packages have been changed but no
      # changesets were found."
      - name: Require a changeset for versionable changes
        if: github.event_name == 'pull_request' && github.base_ref == 'development'
        run: |
          git fetch --no-tags origin +refs/heads/development:refs/heads/development
          pnpm exec changeset status --since=development

      # Versioning is FIXED across the four published packages, so a changeset
      # that names only some of them still bumps all four — and the ones it did
      # not name get a bare `## X.Y.Z` heading with no notes under it. Verified
      # on this repo: a backend-only changeset left packages/common/CHANGELOG.md
      # with an empty 0.2.0 section.
      - name: Require every changeset to cover the whole fixed group
        run: pnpm changesets:verify

      # The release pipeline is five workflow files that publish to npm, so the
      # workflows are load-bearing code and get linted like code. actionlint
      # checks expression contexts, `needs` references, action inputs, and runs
      # shellcheck over every `run:` block — none of which a YAML parse catches.
      # Verified to fail on a bad context and a dangling `needs`.
      - name: Lint the workflows themselves
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.7 -color

      - name: Verify dependency version alignment (catalog policy)
        run: pnpm syncpack:lint

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm turbo run lint

      - name: Prove the boundary bans survive into the effective config
        run: pnpm lint:bans

      - name: Prove the release-channel guard still refuses
        run: pnpm channels:verify

      - name: Typecheck (TypeScript 7)
        run: pnpm turbo run check-types

      - name: Build packages (includes publint + attw gates)
        run: pnpm turbo run build

      - name: Assert build did not rewrite any package.json
        run: git diff --exit-code -- 'packages/*/package.json'

      - name: Unit tests with 100% coverage gate
        run: pnpm test

      - name: Prove the coverage gate can fail
        run: pnpm coverage:canary

      - name: Bundle-size and tree-shaking budgets
        run: pnpm size

      - name: Detect unused files, deps and exports
        run: pnpm knip

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Restore Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-e2e-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-e2e-${{ runner.os }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium webkit

      - name: Start the Docker stack (postgres + redis + mailpit)
        run: |
          cp .env.example .env
          # `next start` reads apps/example/.env*, NOT the repo root — the root
          # copy above only serves docker compose and the migration scripts.
          # Locally this is a symlink a developer creates (see README); CI has
          # to make it explicitly or the app boots with no environment.
          cp .env.example apps/example/.env.local
          docker compose -f docker/compose.yaml --env-file .env up -d --wait

      - name: Apply migrations and seed
        run: pnpm db:migrate && pnpm db:seed

      - name: Build workspace
        run: pnpm turbo run build

      - name: Run integration suite (live RLS/Redis contracts)
        run: pnpm test:integration

      - name: Run E2E tests (full API flow + i18n against the stack)
        run: pnpm e2e
        env:
          E2E_STACK: "1"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
